name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The LLVM major every clang leg installs, stated once. Bumping to the next major is this line
# plus the required-status-check contexts in the repository ruleset, nothing else.
env:
  CLANG_TOOLS_VERSION: "22"

jobs:
  formatting:
    runs-on: ubuntu-24.04
    name: Formatting

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format ${{ env.CLANG_TOOLS_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-format-${{ env.CLANG_TOOLS_VERSION }}
          sudo ln -sf /usr/bin/clang-format-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang-format

      - name: Check clang-format
        run: find src -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # `matrix` cannot read the `env` context, so no entry here names a compiler version:
        # the preset selects clang/clang++ and the install step below decides which major
        # those resolve to. GCC keeps its version in the name because that name is a required
        # status check in the repository ruleset.
        include:
          - preset: clang-debug
            compiler: Clang (Debug)
            install: clang
            extra_cmake_args: -DENABLE_CLANG_TIDY=OFF
          - preset: clang-release
            compiler: Clang (Release)
            install: clang
            extra_cmake_args:
          - preset: clang-release-static
            compiler: Clang (Release, static)
            install: clang
            extra_cmake_args:
          - preset: clang-tsan
            compiler: Clang (ThreadSanitizer)
            install: clang
            extra_cmake_args:
          - preset: gcc-debug
            compiler: GCC 14
            install: gcc
            extra_cmake_args:

    name: ${{ matrix.compiler }}

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.CLANG_TOOLS_VERSION }}
        if: matrix.install == 'clang'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ env.CLANG_TOOLS_VERSION }}
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++

      # Without a symbolizer from the same major, a sanitizer report is a column of addresses.
      - name: Install LLVM ${{ env.CLANG_TOOLS_VERSION }} tools
        if: matrix.preset == 'clang-tsan'
        run: |
          sudo apt-get install -y llvm-${{ env.CLANG_TOOLS_VERSION }}
          sudo ln -sf /usr/bin/llvm-symbolizer-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/llvm-symbolizer

      - name: Install GCC 14
        if: matrix.install == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Install dependencies
        run: sudo apt-get install -y ninja-build catch2 ccache

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.preset }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.extra_cmake_args }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload CLI executable
        if: matrix.preset == 'clang-release-static'
        uses: actions/upload-artifact@v4
        with:
          name: dude-linux-static
          path: build/${{ matrix.preset }}/src/cli/dude

  coverage:
    runs-on: ubuntu-24.04
    name: Code Coverage

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.CLANG_TOOLS_VERSION }} and its LLVM tools
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y llvm-${{ env.CLANG_TOOLS_VERSION }}
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++
          sudo ln -sf /usr/bin/llvm-symbolizer-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/llvm-symbolizer

      - name: Install dependencies
        run: sudo apt-get install -y ninja-build catch2 ccache

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-clang-coverage-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-clang-coverage-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-clang-coverage-${{ github.sha }}
          restore-keys: ccache-clang-coverage-

      - name: Configure
        run: cmake --preset clang-coverage
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset clang-coverage

      - name: Generate coverage report
        run: cmake --build --preset clang-coverage --target coverage

      - name: Enforce minimum coverage (95%)
        run: |
          COVERAGE_JSON="build/clang-coverage/coverage-summary.json"
          llvm-cov-${{ env.CLANG_TOOLS_VERSION }} export build/clang-coverage/src/tests/dude_test \
            -instr-profile=build/clang-coverage/coverage.profdata \
            -summary-only \
            -ignore-filename-regex=_deps/ \
            -ignore-filename-regex=/tests/ \
            -ignore-filename-regex=.cpm-cache/ \
            > "$COVERAGE_JSON"
          python3 -c "
          import json, sys
          with open('$COVERAGE_JSON') as f:
              data = json.load(f)
          totals = data['data'][0]['totals']
          lines = totals['lines']
          pct = lines['percent']
          print(f'Library line coverage: {pct:.2f}% ({lines[\"covered\"]}/{lines[\"count\"]} lines)')
          sys.exit(0 if pct >= 95.0 else 1)
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/clang-coverage/coverage/

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: cl-release
            compiler: MSVC
          - preset: clangcl-release
            compiler: Clang-CL

    name: ${{ matrix.compiler }}

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Create vcpkg binary cache directory
        run: New-Item -ItemType Directory -Force -Path ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload CLI executable
        if: matrix.preset == 'clangcl-release'
        uses: actions/upload-artifact@v4
        with:
          name: dude-windows
          path: build/${{ matrix.preset }}/src/cli/dude.exe
